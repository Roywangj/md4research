<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
<rect width="1200" height="500" fill="#fbfaf7"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">ST-CoT + ST-reward + GRPO（重绘示意）</text>
<g font-family="Arial" font-size="17" fill="#17324d" text-anchor="middle"><rect x="35" y="110" width="200" height="110" rx="16" fill="#dbeafe" stroke="#3676b5" stroke-width="2"/><text x="135" y="148" font-weight="700">视频 + 问题</text><text x="135" y="180">起始/终止帧</text><text x="135" y="207">选项答案</text><rect x="300" y="80" width="250" height="170" rx="16" fill="#fff0d5" stroke="#db8b28" stroke-width="2"/><text x="425" y="115" font-weight="700">ST-CoT 五步推理</text><text x="425" y="147">定义目标 → 起始状态</text><text x="425" y="176">时间推进 → 终止验证</text><text x="425" y="205">证据综合</text><rect x="615" y="110" width="200" height="110" rx="16" fill="#e9d5ff" stroke="#8250ad" stroke-width="2"/><text x="715" y="148" font-weight="700">G 个 rollout</text><text x="715" y="180">O₁ … O_G</text><text x="715" y="207">坐标 + answer</text><rect x="880" y="65" width="270" height="200" rx="16" fill="#dcfce7" stroke="#3b9562" stroke-width="2"/><text x="1015" y="101" font-weight="700">组内奖励</text><text x="1015" y="135">R_acc：选项正确</text><text x="1015" y="165">R_fmt：结构/坐标格式</text><text x="1015" y="195">R_ST：相机/物体坐标对齐</text><text x="1015" y="231">A_g = 标准化组内奖励</text></g><g stroke="#17324d" stroke-width="3" fill="none"><path d="M235 165H300"/><path d="M550 165H615"/><path d="M815 165H880"/><path d="M1015 265V350H425V250"/></g><rect x="170" y="350" width="860" height="82" rx="16" fill="#fee2e2" stroke="#c85858" stroke-width="2"/><text x="600" y="384" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#17324d">GRPO 更新 LoRA：最大化 clipped policy objective − β KL(πθ || πref)</text><text x="600" y="414" text-anchor="middle" font-family="Arial" font-size="17" fill="#17324d">ST-reward 把“物理上合理的中间轨迹”纳入优化，而非只奖励最终选项</text>
</svg>
