<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" fill="#fffdf8"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17324d">SMA: experience-grounded, parameter-update-free growth</text>
  <text x="600" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#52606d">Recreated schematic based on Fig. 2 (PDF p. 3); not a pixel crop</text>
  <g font-family="Arial,sans-serif">
    <rect x="45" y="125" width="225" height="180" rx="18" fill="#eaf3ff" stroke="#3b82c4" stroke-width="3"/>
    <text x="157" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#17324d">Spatial problem</text>
    <rect x="83" y="183" width="150" height="80" rx="8" fill="#d5e7dc" stroke="#6b8f71" stroke-width="2"/>
    <rect x="104" y="211" width="30" height="35" fill="#f7fbff" stroke="#315c78"/>
    <rect x="148" y="199" width="42" height="47" fill="#f7fbff" stroke="#315c78"/>
    <rect x="198" y="217" width="20" height="29" fill="#f7fbff" stroke="#315c78"/>
    <text x="157" y="287" text-anchor="middle" font-size="14" fill="#52606d">image + task + verifier</text>
    <path d="M270 215 H355" stroke="#17324d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="355" y="115" width="250" height="200" rx="18" fill="#f2eaff" stroke="#8469a8" stroke-width="3"/>
    <text x="480" y="151" text-anchor="middle" font-size="21" font-weight="700" fill="#4d3568">Frozen VLM</text>
    <text x="480" y="182" text-anchor="middle" font-size="15" fill="#52606d">query with retrieved lessons</text>
    <rect x="395" y="205" width="170" height="62" rx="10" fill="#fff" stroke="#8469a8"/>
    <text x="480" y="230" text-anchor="middle" font-size="16" fill="#4d3568">prediction</text>
    <text x="480" y="252" text-anchor="middle" font-size="14" fill="#52606d">no parameter update</text>
    <path d="M605 215 H685" stroke="#17324d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="685" y="125" width="190" height="180" rx="18" fill="#fff1d9" stroke="#cf8a29" stroke-width="3"/>
    <text x="780" y="164" text-anchor="middle" font-size="21" font-weight="700" fill="#7a4e12">Verifier</text>
    <text x="780" y="200" text-anchor="middle" font-size="15" fill="#52606d">answer → reward</text>
    <text x="780" y="230" text-anchor="middle" font-size="15" fill="#52606d">correct / incorrect</text>
    <text x="780" y="260" text-anchor="middle" font-size="15" fill="#52606d">transfer evidence</text>
    <path d="M780 305 V380" stroke="#17324d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="605" y="380" width="350" height="160" rx="18" fill="#e9f6e5" stroke="#6b9e63" stroke-width="3"/>
    <text x="780" y="418" text-anchor="middle" font-size="21" font-weight="700" fill="#315c30">Experience memory bank</text>
    <text x="780" y="452" text-anchor="middle" font-size="15" fill="#52606d">summary + transferable lesson</text>
    <text x="780" y="480" text-anchor="middle" font-size="15" fill="#52606d">semantic relevance + TRS</text>
    <text x="780" y="508" text-anchor="middle" font-size="15" fill="#52606d">visit count, reward, reliability</text>
    <path d="M605 460 H480 V315" fill="none" stroke="#17324d" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="515" y="445" text-anchor="middle" font-size="14" fill="#52606d">read-only retrieval</text>
    <rect x="45" y="380" width="435" height="160" rx="18" fill="#f7f7f7" stroke="#9299a1" stroke-width="3"/>
    <text x="262" y="418" text-anchor="middle" font-size="20" font-weight="700" fill="#39434e">Reflection writes a procedure</text>
    <text x="262" y="452" text-anchor="middle" font-size="15" fill="#52606d">verified experience → reusable lesson</text>
    <text x="262" y="480" text-anchor="middle" font-size="15" fill="#52606d">anti-leakage: no old answer or GT</text>
    <text x="262" y="508" text-anchor="middle" font-size="15" fill="#52606d">TRS calibrated by later visits</text>
    <path d="M685 460 H480" stroke="#17324d" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#17324d"/></marker></defs>
</svg>
