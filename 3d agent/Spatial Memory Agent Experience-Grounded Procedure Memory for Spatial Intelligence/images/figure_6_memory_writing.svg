<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect width="1200" height="560" fill="#fffdf8"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17324d">One-pass versus continual memory writing</text>
  <text x="600" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#52606d">Recreated from Fig. 6 (PDF p. 10); endpoint values are transcribed from the supplied PDF</text>
  <g font-family="Arial,sans-serif">
    <rect x="55" y="120" width="1090" height="365" rx="18" fill="#f7f9fb" stroke="#c2cad3" stroke-width="2"/>
    <g stroke="#d7dee6" stroke-width="1"><line x1="110" y1="205" x2="1080" y2="205"/><line x1="110" y1="285" x2="1080" y2="285"/><line x1="110" y1="365" x2="1080" y2="365"/><line x1="110" y1="445" x2="1080" y2="445"/></g>
    <line x1="110" y1="445" x2="1080" y2="445" stroke="#52606d" stroke-width="2"/>
    <text x="120" y="160" font-size="18" font-weight="700" fill="#17324d">Relative trajectory over 10 passes</text>
    <g fill="none" stroke-width="5"><polyline points="140,405 240,400 340,398 440,397 540,396 640,395 740,394 840,393 940,392 1040,391" stroke="#246da8"/><polyline points="140,395 240,360 340,325 440,290 540,255 640,220 740,190 840,165 940,145 1040,128" stroke="#cf8a29" stroke-dasharray="10 7"/></g>
    <g fill="#246da8"><circle cx="1040" cy="391" r="7"/></g><g fill="#cf8a29"><circle cx="1040" cy="128" r="7"/></g>
    <text x="1060" y="396" font-size="16" fill="#246da8">926 cards</text><text x="1060" y="133" font-size="16" fill="#9b6415">9,259 cards</text>
    <rect x="145" y="185" width="185" height="46" rx="10" fill="#eaf3ff" stroke="#3b82c4"/><text x="237" y="214" text-anchor="middle" font-size="15" fill="#17324d">One-pass (ours)</text>
    <rect x="350" y="185" width="240" height="46" rx="10" fill="#fff1d9" stroke="#cf8a29"/><text x="470" y="214" text-anchor="middle" font-size="15" fill="#7a4e12">Continual writing</text>
    <text x="140" y="475" font-size="14" fill="#52606d">Smaller bank</text><text x="485" y="475" font-size="14" fill="#52606d">less redundancy (25.38% vs 46.37%)</text><text x="875" y="475" font-size="14" fill="#52606d">more TRS-update coverage (64.25% vs 31.96%)</text>
