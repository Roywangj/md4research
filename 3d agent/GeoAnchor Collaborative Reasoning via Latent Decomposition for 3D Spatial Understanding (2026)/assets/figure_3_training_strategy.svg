<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="#fff"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#173b63">Figure 3 schematic — four-stage collaborative training</text><text x="600" y="66" text-anchor="middle" font-family="Arial" font-size="15" fill="#555">Recreated schematic from the paper figure; stages proceed from local grounding to adaptive latent selection.</text><g font-family="Arial"><rect x="35" y="105" width="260" height="260" rx="14" fill="#eef5ff" stroke="#6684c4" stroke-width="2"/><text x="165" y="140" text-anchor="middle" font-size="18" font-weight="700">Stage 1</text><text x="165" y="168" text-anchor="middle" font-size="16">Local perception warm-up</text><text x="60" y="215" font-size="15">3D grounding dataset</text><text x="60" y="245" font-size="15">position latent + direction latent</text><text x="60" y="275" font-size="15">explicit local supervision</text><text x="60" y="325" font-size="14" fill="#555">L_CE + L_pos + L_dir</text><rect x="320" y="105" width="260" height="260" rx="14" fill="#effaf4" stroke="#62a878" stroke-width="2"/><text x="450" y="140" text-anchor="middle" font-size="18" font-weight="700">Stage 2</text><text x="450" y="168" text-anchor="middle" font-size="16">Spatial latent reasoning</text><text x="345" y="215" font-size="15">spatial reasoning dataset</text><text x="345" y="245" font-size="15">local + global geometry</text><text x="345" y="275" font-size="15">joint latent supervision</text><text x="345" y="325" font-size="14" fill="#555">L_CE + L_pos + L_dir + L_geo</text><rect x="605" y="105" width="260" height="260" rx="14" fill="#fff9e8" stroke="#c39b48" stroke-width="2"/><text x="735" y="140" text-anchor="middle" font-size="18" font-weight="700">Stage 3</text><text x="735" y="168" text-anchor="middle" font-size="16">Latent relaxation</text><text x="630" y="215" font-size="15">text supervision only</text><text x="630" y="245" font-size="15">λ_pos = λ_geo = 0</text><text x="630" y="275" font-size="15">preserve language manifold</text><text x="630" y="325" font-size="14" fill="#555">latent supervision removed</text><rect x="890" y="105" width="275" height="260" rx="14" fill="#fff0e9" stroke="#cd815e" stroke-width="2"/><text x="1027" y="140" text-anchor="middle" font-size="18" font-weight="700">Stage 4</text><text x="1027" y="168" text-anchor="middle" font-size="16">Adaptive latent RL</text><text x="915" y="215" font-size="15">local-only vs local+global</text><text x="915" y="245" font-size="15">GRPO; format + accuracy</text><text x="915" y="275" font-size="15">pattern-specific reward</text><text x="915" y="325" font-size="14" fill="#555">dynamic token selection</text><path d="M295 235H320M580 235H605M865 235H890" stroke="#555" stroke-width="4" marker-end="url(#a)"/><rect x="140" y="415" width="920" height="75" rx="14" fill="#f2f2f2" stroke="#888"/><text x="600" y="445" text-anchor="middle" font-size="18" font-weight="700">coarse-to-fine progression</text><text x="600" y="470" text-anchor="middle" font-size="15">local evidence → holistic spatial understanding → adaptive evidence use</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#555"/></marker></defs></svg>